appId: com.courtvision.app
productName: CourtVision
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/.env"
  - "!**/.env.development"
  - "!**/.env.production"
  - "!**/.env.test"
  - "**/.env.local"
publish:
  provider: github
  owner: kennethhuang7
  repo: CourtVision
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  artifactName: "${productName}.Setup.${version}.${ext}"
win:
  target:
    - nsis
    - portable
  icon: public/courtvision.ico
protocols:
  - name: courtvision
    schemes:
      - courtvision
