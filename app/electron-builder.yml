appId: com.courtvision.app
productName: CourtVision
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
publish:
  provider: github
  owner: kennethhuang7
  repo: CourtVision
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
win:
  target:
    - nsis
    - portable
  icon: public/courtvision.ico
  protocol:
    - name: courtvision
      schemes:
        - courtvision
