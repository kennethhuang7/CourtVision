<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourtVision - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: hsl(225 25% 4%);
            --bg-card: hsl(225 20% 7%);
            --bg-card-alpha: hsl(225 20% 7%);
            --text-primary: hsl(0 0% 98%);
            --text-secondary: hsl(220 10% 55%);
            --text-accent: hsl(250 85% 65%);
            --border-color: hsl(225 18% 16%);
            --primary-color: hsl(250 85% 65%);
            --accent-color: hsl(195 100% 50%);
            --gradient-primary: linear-gradient(135deg, hsl(250 85% 65%) 0%, hsl(195 100% 50%) 50%, hsl(260 80% 55%) 100%);
            --loading-gradient: linear-gradient(90deg, hsl(250 85% 65%) 0%, hsl(260 80% 55%) 30%, hsl(270 75% 60%) 70%, hsl(250 85% 65%) 100%);
        }

        body.light {
            --bg-primary: hsl(0 0% 98%);
            --bg-card: hsl(0 0% 100%);
            --bg-card-alpha: hsl(0 0% 100%);
            --text-primary: hsl(225 25% 12%);
            --text-secondary: hsl(225 10% 45%);
            --text-accent: hsl(250 75% 55%);
            --border-color: hsl(225 15% 88%);
            --primary-color: hsl(250 75% 55%);
            --accent-color: hsl(195 90% 45%);
            --gradient-primary: linear-gradient(135deg, hsl(250 75% 55%) 0%, hsl(195 90% 45%) 50%, hsl(260 70% 50%) 100%);
            --loading-gradient: linear-gradient(90deg, hsl(250 75% 55%) 0%, hsl(260 70% 50%) 30%, hsl(270 65% 55%) 70%, hsl(250 75% 55%) 100%);
        }

        body.midnight {
            --bg-primary: hsl(222 47% 6%);
            --bg-card: hsl(222 45% 9%);
            --bg-card-alpha: hsl(222 45% 9%);
            --text-primary: hsl(210 40% 98%);
            --text-secondary: hsl(217 30% 55%);
            --text-accent: hsl(250 85% 65%);
            --border-color: hsl(222 40% 18%);
            --loading-gradient: linear-gradient(90deg, hsl(250 85% 65%) 0%, hsl(260 80% 55%) 30%, hsl(270 75% 60%) 70%, hsl(250 85% 65%) 100%);
        }

        body.amoled {
            --bg-primary: hsl(0 0% 0%);
            --bg-card: hsl(225 20% 4%);
            --bg-card-alpha: hsl(225 20% 4%);
            --text-primary: hsl(0 0% 98%);
            --text-secondary: hsl(220 10% 55%);
            --text-accent: hsl(250 85% 65%);
            --border-color: hsl(225 15% 12%);
            --loading-gradient: linear-gradient(90deg, hsl(250 85% 65%) 0%, hsl(260 80% 55%) 30%, hsl(270 75% 60%) 70%, hsl(250 85% 65%) 100%);
        }

        body {
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            position: relative;
            transition: background-color 0.3s ease;
        }

        .splash-container {
            width: 600px;
            height: 400px;
            position: relative;
            background: var(--bg-card-alpha);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px var(--border-color);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .court-container {
            width: 100%;
            height: 220px;
            margin-top: 10px;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 50px hsl(var(--primary-color) / 0.2));
        }

        .court-line {
            stroke: var(--primary-color);
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 8px hsl(var(--primary-color) / 0.6));
        }

        .court-line.animated {
            stroke-dasharray: 5000;
            stroke-dashoffset: 5000;
        }
        
        .perimeter.animated {
            stroke-dasharray: 2800;
            stroke-dashoffset: 2800;
            opacity: 1;
        }
        
        .key-left.animated, .key-right.animated {
            stroke-dasharray: 800;
            stroke-dashoffset: 800;
            opacity: 0;
        }
        
        .ft-top-left.animated {
            stroke-dasharray: 380 6;
            stroke-dashoffset: 380;
            opacity: 0;
        }
        .ft-bottom-left.animated {
            stroke-dasharray: 380;
            stroke-dashoffset: 380;
            opacity: 0;
        }
        .ft-top-right.animated {
            stroke-dasharray: 380 6;
            stroke-dashoffset: 380;
            opacity: 0;
        }
        .ft-bottom-right.animated {
            stroke-dasharray: 380;
            stroke-dashoffset: 380;
            opacity: 0;
        }
        
        .three-left.animated, .three-right.animated {
            stroke-dasharray: 1200;
            stroke-dashoffset: 1200;
            opacity: 0;
        }
        
        .restricted-left.animated, .restricted-right.animated {
            stroke-dasharray: 270;
            stroke-dashoffset: 270;
            opacity: 0;
        }
        
        .center-line.animated {
            stroke-dasharray: 430;
            stroke-dashoffset: 430;
            opacity: 0;
        }
        
        .center-circle-outer.animated {
            stroke-dasharray: 402;
            stroke-dashoffset: 402;
            opacity: 0;
        }
        
        .center-circle-inner.animated {
            stroke-dasharray: 132;
            stroke-dashoffset: 132;
            opacity: 0;
        }

        .perimeter {
            animation: drawLine 0.8s ease-out forwards;
            animation-delay: 0s;
        }

        .key-left, .key-right, .ft-top-left, .ft-bottom-left, .ft-top-right, .ft-bottom-right,
        .three-left, .three-right, .restricted-left, .restricted-right, .center-line,
        .center-circle-outer, .center-circle-inner {
            opacity: 0;
        }

        .three-left { 
            animation: drawLine 1.9s ease-out forwards, fadeIn 0.01s ease-out 0.8s forwards;
            animation-delay: 0.8s, 0.8s;
        }
        .three-right { 
            animation: drawLine 1.9s ease-out forwards, fadeIn 0.01s ease-out 0.8s forwards;
            animation-delay: 0.8s, 0.8s;
        }
        .key-left { 
            animation: drawLine 2.2s ease-out forwards, fadeIn 0.01s ease-out 1s forwards;
            animation-delay: 1s, 1s;
        }
        .key-right { 
            animation: drawLine 2.2s ease-out forwards, fadeIn 0.01s ease-out 1s forwards;
            animation-delay: 1s, 1s;
        }
        .ft-top-left { 
            animation: drawLine 1.6s ease-out forwards, fadeIn 0.01s ease-out 1.2s forwards;
            animation-delay: 1.2s, 1.2s;
        }
        .ft-bottom-left { 
            animation: drawLine 1.6s ease-out forwards, fadeIn 0.01s ease-out 1.2s forwards;
            animation-delay: 1.2s, 1.2s;
        }
        .ft-top-right { 
            animation: drawLine 1.6s ease-out forwards, fadeIn 0.01s ease-out 1.2s forwards;
            animation-delay: 1.2s, 1.2s;
        }
        .ft-bottom-right { 
            animation: drawLine 1.6s ease-out forwards, fadeIn 0.01s ease-out 1.2s forwards;
            animation-delay: 1.2s, 1.2s;
        }
        .restricted-left { 
            animation: drawLine 1.2s ease-out forwards, fadeIn 0.01s ease-out 1.4s forwards;
            animation-delay: 1.4s, 1.4s;
        }
        .restricted-right { 
            animation: drawLine 1.2s ease-out forwards, fadeIn 0.01s ease-out 1.4s forwards;
            animation-delay: 1.4s, 1.4s;
        }
        .center-line { 
            animation: drawLine 1.4s ease-out forwards, fadeIn 0.01s ease-out 1.6s forwards;
            animation-delay: 1.6s, 1.6s;
        }
        .center-circle-outer { 
            animation: drawCircle 1.6s ease-out forwards, fadeIn 0.01s ease-out 1.8s forwards;
            animation-delay: 1.8s, 1.8s;
        }
        .center-circle-inner { 
            animation: drawCircle 1s ease-out forwards, fadeIn 0.01s ease-out 2s forwards;
            animation-delay: 2s, 2s;
        }

        .hoop {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 3;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 3s forwards;
        }


        .content {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
        }

        .logo-svg {
            width: 100%;
            height: 60px;
            margin-bottom: 10px;
        }
        
        .logo-text {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 40px;
            font-weight: 700;
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 2;
            stroke-dasharray: 500;
            stroke-dashoffset: 500;
            letter-spacing: -1px;
            animation: drawText 2.3s ease-out forwards;
            animation-delay: 0.8s;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-accent);
            margin-bottom: 5px;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.6s forwards;
        }

        .tagline {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.9s forwards;
        }

        .user-info {
            position: absolute;
            top: 20px;
            right: 20px;
            display: none;
            align-items: center;
            gap: 8px;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 1.2s forwards;
        }

        .user-info.visible {
            display: flex;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            object-fit: cover;
            background: var(--bg-card);
            flex-shrink: 0;
        }

        .user-label {
            font-size: 12px;
            color: var(--text-secondary);
            opacity: 0.7;
        }
        
        .user-name {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .loading-bar-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 360px;
            height: 3px;
            background: var(--border-color);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            background: var(--loading-gradient);
            width: 0%;
            animation: loadProgress 3.1s ease-out forwards;
            border-radius: 2px;
            box-shadow: 0 0 10px hsl(var(--primary-color) / 0.5);
        }

        @keyframes drawLine {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes drawCircle {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes logoFadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes loadProgress {
            to {
                width: 100%;
            }
        }
        
        @keyframes drawText {
            to {
                stroke-dashoffset: 0;
            }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="court-container">
            <svg viewBox="0 0 1000 550" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
                <path class="court-line animated perimeter" d="M 20 60 L 980 60 L 980 490 L 20 490 Z"/>
                
                <path class="court-line animated key-left" d="M 20 175 L 222 175 L 222 375 L 20 375 Z"/>
                
                <path class="court-line animated key-right" d="M 980 175 L 778 175 L 778 375 L 980 375 Z"/>
                
                <path class="court-line animated ft-top-left" 
                      d="M 162 275 A 60 60 0 0 1 282 275"/>
                
                <path class="court-line animated ft-bottom-left" 
                      d="M 282 275 A 60 60 0 0 1 162 275"/>
                
                <path class="court-line animated ft-top-right" 
                      d="M 838 275 A 60 60 0 0 0 718 275"/>
                
                <path class="court-line animated ft-bottom-right" 
                      d="M 718 275 A 60 60 0 0 0 838 275"/>
                
                <path class="court-line animated three-left" 
                      d="M 20 92 L 115 92 A 253 253 0 0 1 115 458 L 20 458"/>
                
                <path class="court-line animated three-right" 
                      d="M 980 92 L 885 92 A 253 253 0 0 0 885 458 L 980 458"/>
                
                <path class="court-line animated restricted-left" 
                      d="M 63 232 A 43 43 0 0 1 63 318"/>
                
                <path class="court-line animated restricted-right" 
                      d="M 937 232 A 43 43 0 0 0 937 318"/>
                
                <path class="court-line animated center-line" d="M 500 60 L 500 490"/>
                
                <path class="court-line animated center-circle-outer" d="M 564 275 A 64 64 0 0 0 436 275 A 64 64 0 0 0 564 275"/>
                
                <path class="court-line animated center-circle-inner" d="M 521 275 A 21 21 0 0 0 479 275 A 21 21 0 0 0 521 275"/>
                
                <circle class="hoop" cx="55" cy="275" r="9"/>
                <circle class="hoop" cx="945" cy="275" r="9"/>
            </svg>
            
        </div>
        
        <div class="content">
            <svg class="logo-svg" viewBox="0 0 400 60" xmlns="http://www.w3.org/2000/svg">
                <text class="logo-text" x="200" y="40" text-anchor="middle" dominant-baseline="middle">COURTVISION</text>
            </svg>
            <div class="subtitle">NBA Player Performance</div>
            <div class="tagline">Machine learning-powered predictions</div>
        </div>
        
        <div class="user-info" id="user-info">
            <img class="user-avatar" id="user-avatar" alt="" style="display: none;" />
            <span class="user-label">Signed in as:</span>
            <span class="user-name" id="user-name"></span>
        </div>
        
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
        </div>
    </div>

    <script>
        function applyTheme() {
            try {
                const theme = localStorage.getItem('app-theme') || 'dark';
                const resolvedTheme = theme === 'sync' 
                    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : theme;
                
                document.body.className = resolvedTheme;
            } catch (e) {
                document.body.className = 'dark';
            }
        }

        applyTheme();

        window.addEventListener('storage', (e) => {
            if (e.key === 'app-theme') {
                applyTheme();
            }
        });

        function loadUserInfo() {
            try {
                const sessionKeys = Object.keys(localStorage).filter(key =>
                    key.startsWith('sb-') && key.includes('-auth-token')
                );
                
                if (sessionKeys.length > 0) {
                    try {
                        const sessionKey = sessionKeys[0];
                        const sessionData = localStorage.getItem(sessionKey);
                        if (sessionData) {
                            const session = JSON.parse(sessionData);
                            if (session && session.user) {
                                const user = session.user;
                                const userInfoEl = document.getElementById('user-info');
                                const avatarEl = document.getElementById('user-avatar');
                                const nameEl = document.getElementById('user-name');
                                
                                if (userInfoEl && nameEl && avatarEl) {
                                    const displayName = user.user_metadata?.display_name || 
                                                       user.user_metadata?.username || 
                                                       user.email?.split('@')[0] || 
                                                       'User';
                                    
                                    nameEl.textContent = displayName;
                                    
                                    const avatarUrl = user.user_metadata?.profile_picture_url || 
                                                      user.user_metadata?.avatar_url ||
                                                      user.avatar_url;
                                    
                                    if (avatarUrl) {
                                        avatarEl.src = avatarUrl;
                                        avatarEl.style.display = 'block';
                                        avatarEl.onerror = () => {
                                            avatarEl.style.display = 'none';
                                        };
                                    } else {
                                        avatarEl.style.display = 'none';
                                    }
                                    
                                    userInfoEl.classList.add('visible');
                                }
                            }
                        }
                    } catch (e) {
                    }
                }
            } catch (e) {
            }
        }

        setTimeout(loadUserInfo, 100);

        if (window.electron && window.electron.splashReady) {
            window.electron.splashReady();
        }
    </script>
</body>
</html>
