<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="CourtVision">
  <defs>
    <linearGradient id="cvG" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="hsl(252 90% 66%)"/>
      <stop offset="0.5" stop-color="hsl(210 100% 58%)"/>
      <stop offset="1" stop-color="hsl(262 85% 58%)"/>
    </linearGradient>
    <radialGradient id="cvGlow" cx="35%" cy="25%" r="70%">
      <stop offset="0" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <rect x="24" y="24" width="208" height="208" rx="56" fill="url(#cvG)"/>
  <rect x="24" y="24" width="208" height="208" rx="56" fill="url(#cvGlow)"/>

  <!-- Subtle inner border -->
  <rect x="32" y="32" width="192" height="192" rx="48" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Monogram -->
  <g fill="rgba(0,0,0,0.22)">
    <text x="129" y="158" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="88" font-weight="800" letter-spacing="-2">CV</text>
  </g>
  <g fill="rgba(255,255,255,0.96)">
    <text x="128" y="156" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="88" font-weight="800" letter-spacing="-2">CV</text>
  </g>
</svg>

